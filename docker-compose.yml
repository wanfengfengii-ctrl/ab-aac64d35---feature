services:
  api:
    build: .
    image: barcode-assembler:latest
    environment:
      # 可配置端口：API_PORT 同时决定进程监听与容器映射端口
      API_PORT: ${API_PORT:-8080}
    ports:
      - "${API_PORT:-8080}:${API_PORT:-8080}"
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request;urllib.request.urlopen('http://127.0.0.1:%s/health' % os.environ['API_PORT'])"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 2s

  verify:
    build: .
    image: barcode-assembler:latest
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_HOST: api
      API_PORT: ${API_PORT:-8080}
    # 一次性服务：等待就绪 -> 构建自检 -> 单测 -> 唯一/歧义/无解冒烟 -> 退出码报告
    command: ["python", "verify.py"]
    restart: "no"
